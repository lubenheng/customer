# ==========================================================================================
# 网页文字总表：网站上显示的所有文字都在这里修改。
#
# 修改后：
#   - 本地预览（npm run docs:dev）会自动刷新；
#   - 提交并推送到 GitHub 后，网站 1～3 分钟内自动更新。
#
# 书写规则（写错会导致构建失败，报错信息会指出问题所在）：
#   1. 用 UTF-8 编码保存（VS Code 默认即是；记事本“另存为”时编码选 UTF-8）。
#   2. 缩进只能用空格，不能用 Tab；同一级必须左对齐。
#   3. 冒号后面要有一个空格，如「标题: 产品中心」。
#   4. 文字里含有英文冒号加空格「: 」、或以 # [ { ' " 等符号开头时，用英文单引号把整段包起来。
#   5. 以「|」开头的是多行正文，按 Markdown 书写，每行都要比上一级多缩进两个空格。
#   6. 「#」后面的内容是注释，不会显示在网页上。
#
# 页面文件（index.md、products/、docs/、code/、changelog/）由本表自动生成，请勿直接修改。
# ==========================================================================================


