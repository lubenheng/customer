# ---------- 文档中心（/docs/）----------
# 分组：左侧栏的分组标题；页面：分组下的文章。
# 文件：决定网址 /docs/<文件>，只能用英文小写、数字、短横线，不能重复。
# 标题：侧边栏和文章大标题；正文：文章内容（Markdown），不用再写大标题。
文档中心:
  分组:
    - 标题: 快速开始
      页面:
        - 文件: getting-started
          标题: 快速开始
          正文: |
            本页介绍如何在本地运行文档站点。

            ## 本地运行

            ```bash
            npm install
            npm run docs:dev
            ```

            浏览器访问终端输出的地址（默认 `http://localhost:5173`）即可预览。

            ## 自动部署

            文档更新后，Cloudflare Pages 会自动重新构建部署。

    - 标题: 用户手册
      页面:
        - 文件: manual
          标题: 用户手册
          正文: |
            ## 概述

            此处填写产品概述。

            ## 功能说明

            此处填写各功能的使用方法。

            ## 常见问题

            此处填写常见问题与解答。

    - 标题: 应用笔记
      页面:
        - 文件: notes
          标题: 应用笔记
          正文: |
            ## AN-001 示例笔记

            此处填写应用场景、操作步骤与注意事项。


